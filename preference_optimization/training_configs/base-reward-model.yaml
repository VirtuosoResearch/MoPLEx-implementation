# Model arguments
model_name_or_path: Qwen/Qwen2-0.5B-Instruct
torch_dtype: null
attn_implementation: flash_attention_2

# Data training arguments
dataset_mixer:
  HuggingFaceH4/ultrafeedback_binarized: 1.0
dataset_splits:
- train_prefs
- test_prefs
preprocessing_num_workers: 12
load_multi_preference: True
load_multi_preference_criterions: "overall_score,helpfulness,honesty,instruction_following,truthfulness"

# Trainer arguments
bf16: false
do_eval: true
evaluation_strategy: steps
eval_steps: 200
gradient_accumulation_steps: 16
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: False
hub_model_id: reward-exps
learning_rate: 1.0e-5
log_level: info
logging_steps: 5
lr_scheduler_type: cosine
max_length: 2048
num_train_epochs: 1
optim: adamw_torch
output_dir: outputs/base-reward-qwen
run_name: base-reward-model
per_device_train_batch_size: 2
per_device_eval_batch_size: 4
push_to_hub: false
save_strategy: "steps"
save_steps: 1000000
report_to:
- wandb
save_total_limit: 20
seed: 42
warmup_ratio: 0.1
